[project]
name = "uatu-tools"
version = "2.1.0"
description = "Validador forense y herramientas de cátedra de uatu (auditoría Git-native de exámenes)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]

[project.scripts]
uatu-audit = "uatu_tools.audit:main"
uatu-admin = "uatu_tools.admin:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uatu_tools"]
